<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
    }

    .shortcuts {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      flex-wrap: wrap;
    }
    .shortcut {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      text-decoration: none;
      color: var(--text-dim);
      font-size: 12px;
      transition: border-color 0.15s, color 0.15s;
    }
    .shortcut:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .shortcut img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }

    iframe {
      border: none;
      width: 100vw;
      height: calc(100vh - 60px);
    }
    .fallback {
      text-align: center;
      padding: 40px;
      display: none;
    }
    .fallback a { color: var(--accent); }
  </style>
</head>
<body>

<div class="shortcuts" id="shortcuts"></div>

<iframe id="dashboard" src="http://NSF-Leith:8080"></iframe>
<div class="fallback" id="fallback">
  <p>Dashboard server not running on NSF-Leith.</p>
  <p>Make sure the weight tracker server is running on the main PC.</p>
  <p>Or <a href="http://NSF-Leith:8080">try again</a></p>
</div>

<script>
const shortcuts = [
  { name: 'Toby', url: 'https://www.gettoby.com/open-toby' },
  { name: 'Blackboard', url: 'https://bb.siue.edu/ultra/' },
  { name: 'GitHub', url: 'https://github.com/' },
  { name: 'SIM Lab', url: 'https://sim-lab-siue.github.io/' },
  { name: 'SIM DAD', url: 'https://simdadllc.com/' },
  { name: 'Claude', url: 'https://claude.ai/' },
  { name: 'YouTube', url: 'https://www.youtube.com/' },
  { name: 'Amazon', url: 'https://www.amazon.com/' },
];

const container = document.getElementById('shortcuts');
container.innerHTML = shortcuts.map(s => {
  const favicon = `https://www.google.com/s2/favicons?domain=${new URL(s.url).hostname}&sz=32`;
  return `<a class="shortcut" href="${s.url}" target="_top">
    <img src="${favicon}" alt="">
    ${s.name}
  </a>`;
}).join('');

// Dashboard iframe fallback
const iframe = document.getElementById('dashboard');
const fallback = document.getElementById('fallback');
let loaded = false;
iframe.onload = () => { loaded = true; };
setTimeout(() => {
  if (!loaded) {
    iframe.style.display = 'none';
    fallback.style.display = 'block';
  }
}, 3000);
</script>
</body>
</html>
